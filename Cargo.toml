[workspace.package]
version = "2.3.1"
authors = ["Paseo Core Team"]
edition = "2021"
homepage = "https://github.com/paseo-network/runtimes"
repository = "https://github.com/paseo-network/runtimes.git"
license = "GPL-3.0-only"                                     # TODO <https://github.com/paseo-fellows/runtimes/issues/29>

[workspace.lints.clippy]
bind_instead_of_map = { level = "allow", priority = 2 }              # stylistic
borrowed-box = { level = "allow", priority = 2 }                     # Reasonable to fix this one
complexity = { level = "warn", priority = 1 }
correctness = { level = "warn", priority = 1 }
default_constructed_unit_structs = { level = "allow", priority = 2 } # stylistic
derivable_impls = { level = "allow", priority = 2 }                  # false positives
eq_op = { level = "allow", priority = 2 }                            # In tests we test equality.
erasing_op = { level = "allow", priority = 2 }                       # E.g. 0 * DOLLARS
extra-unused-type-parameters = { level = "allow", priority = 2 }     # stylistic
identity-op = { level = "allow", priority = 2 }                      # One case where we do 0 +
if-same-then-else = { level = "allow", priority = 2 }
needless-lifetimes = { level = "allow", priority = 2 }               # generated code
needless_option_as_deref = { level = "allow", priority = 2 }         # false positives
nonminimal-bool = { level = "allow", priority = 2 }                  # maybe
option-map-unit-fn = { level = "allow", priority = 2 }               # stylistic
stable_sort_primitive = { level = "allow", priority = 2 }            # prefer stable sort
too-many-arguments = { level = "allow", priority = 2 }               # (Turning this on would lead to)
type_complexity = { level = "allow", priority = 2 }                  # raison d'etre
unit_arg = { level = "allow", priority = 2 }                         # stylistic
unnecessary_cast = { level = "allow", priority = 2 }                 # Types may change
useless_conversion = { level = "allow", priority = 2 }               # Types may change
while_immutable_condition = { level = "allow", priority = 2 }        # false positives
zero-prefixed-literal = { level = "allow", priority = 2 }            # 00_1000_000
len_zero = { level = "allow", priority = 2 }

[workspace.dependencies]

# ---- Individuality (proof-of-personhood) external deps ----
# `verifiable` moves from the git rev to crates.io 0.3.0. The version number goes DOWN
# (the git rev self-reports 0.5.0) but 0.3.0 is 42 commits NEWER: the maintainers reset the
# dev version for the first crates.io release (`6a2cad6 "Set version to 0.3"`).
# The move is FORCED, not optional: individuality v0.3.1's `pallets/members` does not compile
# against the git rev (`BatchProofItem` gained two generics and `batch_validate` changed arity).
# Ring builder-params are byte-identical across the two revisions, so `ChunkPageHashesInitialization`
# still no-ops over People's existing chunk page hashes.
# ⚠ The stored `Members`/`MembersCommitment` shape is NOT identical (768 B -> 288 B); that is a
# storage-migration concern handled per-pallet, not a pin concern.
verifiable = { version = "0.3.0", default-features = false }
alloy-core = { version = "1.2.1", default-features = false }
ethereum-standards = { version = "0.1.3", default-features = false }
bounded-collections = { version = "0.3.2", default-features = false }
ed25519-zebra = { version = "4.0.3", default-features = false }
merlin = { version = "3.0", default-features = false }
schnorrkel = { version = "0.11.5", default-features = false }
rand_core = { version = "0.6", default-features = false }
parking_lot = { version = "0.12.3", default-features = false }
sp-keystore = { version = "0.47.0", default-features = false }
sp-statement-store = { version = "26.0.0", default-features = false }
# frame companions required by the individuality runtimes (pinned to the frame-support 47 train)
pallet-assets-freezer = { version = "0.16.0", default-features = false }
pallet-verify-signature = { version = "0.11.0", default-features = false }
pallet-pgas-allowance = { version = "0.3.0", default-features = false }
# needed by the individuality pallets from v0.3.x on (all `sp_core::blake2_256` call sites moved here)
sp-crypto-hashing = { version = "0.1.0", default-features = false }
# ---- arkworks / EC host-call split, required by `support/src/crypto*` from v0.3.x on ----
# ⚠ `sp-crypto-ec-utils` is NOT frame-independent: it tracks `sp-runtime-interface`.
#      0.21.1 -> sp-runtime-interface ^35  (this workspace, polkadot-sdk 2603)
#      0.23.0 -> sp-runtime-interface ^37  (individuality's own pin, polkadot-sdk 2606)
#   Taking upstream's 0.23.0 would drag sp-runtime-interface 37 into the graph and manufacture
#   the very SDK conflict this port is designed to avoid. Pin 0.21.1.
sp-crypto-ec-utils = { version = "0.21.1", default-features = false }
ark-bls12-381-ext = { version = "0.6", default-features = false }
ark-ec = { version = "0.6", default-features = false }
ark-ed-on-bls12-381-bandersnatch-ext = { version = "0.6", default-features = false }
ark-ff = { version = "0.6", default-features = false }
ark-scale = { version = "0.0.14", default-features = false }
getrandom = { version = "0.2", default-features = false }
spin = { version = "0.9", default-features = false, features = ["once"] }

