[package]
name = "indiv-pallet-dotns-gateway"
description = "Gateway pallet for dotNS smart contract username reservation and registration"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
alloy-core = { workspace = true, features = ["sol-types"] }
codec = { workspace = true, features = ["derive"] }
log = { workspace = true }
scale-info = { workspace = true, features = ["derive"] }
frame-benchmarking = { workspace = true, optional = true }
frame-support = { workspace = true }
frame-system = { workspace = true }
sp-core = { workspace = true }
sp-crypto-hashing = { workspace = true }
sp-io = { workspace = true }
sp-runtime = { workspace = true }

indiv-pallet-members-subscriber = { workspace = true }
indiv-support = { workspace = true }
verifiable = { workspace = true }

[dev-dependencies]
pallet-balances = { workspace = true }
verifiable = { workspace = true, features = ["mock"] }
xcm = { workspace = true }

[features]
default = ["std"]
std = [
	"alloy-core/std",
	"codec/std",
	"frame-benchmarking?/std",
	"frame-support/std",
	"frame-system/std",
	"indiv-pallet-members-subscriber/std",
	"indiv-support/std",
	"log/std",
	"pallet-balances/std",
	"scale-info/std",
	"sp-core/std",
	"sp-crypto-hashing/std",
	"sp-io/std",
	"sp-runtime/std",
	"verifiable/std",
	"xcm/std",
]
runtime-benchmarks = [
	"frame-benchmarking/runtime-benchmarks",
	"frame-support/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"indiv-pallet-members-subscriber/runtime-benchmarks",
	"indiv-support/runtime-benchmarks",
	"pallet-balances/runtime-benchmarks",
	"sp-runtime/runtime-benchmarks",
	"xcm/runtime-benchmarks",
]
try-runtime = [
	"frame-support/try-runtime",
	"frame-system/try-runtime",
	"indiv-pallet-members-subscriber/try-runtime",
	"pallet-balances/try-runtime",
	"sp-runtime/try-runtime",
]
