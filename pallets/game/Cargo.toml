[package]
name = "indiv-pallet-game"
description = "Game Pallet"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { workspace = true, features = ["derive"] }
log = { workspace = true }
scale-info = { workspace = true, features = ["derive"] }
cumulus-pallet-parachain-system = { workspace = true }
cumulus-primitives-core = { workspace = true }
frame-benchmarking = { workspace = true, optional = true }
frame-support = { workspace = true }
frame-system = { workspace = true }
sp-api = { workspace = true }
sp-core = { workspace = true }
sp-io = { workspace = true }
sp-runtime = { workspace = true }
sp-state-machine = { workspace = true }
sp-statement-store = { workspace = true }
sp-trie = { workspace = true }

indiv-pallet-airdrop = { workspace = true }
indiv-pallet-people = { workspace = true }
indiv-pallet-score = { workspace = true }
indiv-support = { workspace = true }
verifiable = { workspace = true }

[dev-dependencies]
indiv-pallet-chunks-manager = { workspace = true }
indiv-pallet-members = { workspace = true }
verifiable = { workspace = true, features = ["mock"] }
pallet-assets = { workspace = true }
pallet-assets-holder = { workspace = true }
pallet-balances = { workspace = true }
xcm = { workspace = true }

[features]
default = ["std"]
testnet = []
std = [
	"codec/std",
	"cumulus-pallet-parachain-system/std",
	"cumulus-primitives-core/std",
	"frame-benchmarking?/std",
	"frame-support/std",
	"frame-system/std",
	"indiv-pallet-airdrop/std",
	"indiv-pallet-chunks-manager/std",
	"indiv-pallet-members/std",
	"indiv-pallet-people/std",
	"indiv-pallet-score/std",
	"indiv-support/std",
	"log/std",
	"pallet-assets-holder/std",
	"pallet-assets/std",
	"pallet-balances/std",
	"scale-info/std",
	"sp-api/std",
	"sp-core/std",
	"sp-io/std",
	"sp-runtime/std",
	"sp-state-machine/std",
	"sp-statement-store/std",
	"sp-trie/std",
	"verifiable/std",
	"xcm/std",
]
runtime-benchmarks = [
	"cumulus-pallet-parachain-system/runtime-benchmarks",
	"cumulus-primitives-core/runtime-benchmarks",
	"frame-benchmarking/runtime-benchmarks",
	"frame-support/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"indiv-pallet-airdrop/runtime-benchmarks",
	"indiv-pallet-chunks-manager/runtime-benchmarks",
	"indiv-pallet-members/runtime-benchmarks",
	"indiv-pallet-people/runtime-benchmarks",
	"indiv-pallet-score/runtime-benchmarks",
	"indiv-support/runtime-benchmarks",
	"pallet-assets-holder/runtime-benchmarks",
	"pallet-assets/runtime-benchmarks",
	"pallet-balances/runtime-benchmarks",
	"sp-runtime/runtime-benchmarks",
	"xcm/runtime-benchmarks",
]
try-runtime = [
	"cumulus-pallet-parachain-system/try-runtime",
	"frame-support/try-runtime",
	"frame-system/try-runtime",
	"indiv-pallet-airdrop/try-runtime",
	"indiv-pallet-chunks-manager/try-runtime",
	"indiv-pallet-members/try-runtime",
	"indiv-pallet-people/try-runtime",
	"indiv-pallet-score/try-runtime",
	"pallet-assets-holder/try-runtime",
	"pallet-assets/try-runtime",
	"pallet-balances/try-runtime",
	"sp-runtime/try-runtime",
]
