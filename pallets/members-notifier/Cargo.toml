[package]
name = "indiv-pallet-members-notifier"
description = "Members Notifier Pallet - Manages subscriptions from parachains for ring root updates"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { workspace = true, features = ["derive"] }
log = { workspace = true }
scale-info = { workspace = true, features = ["derive"] }
# PASEO DEVIATION (the only one in this pallet). Upstream writes `serde = { workspace = true }`,
# which under individuality's own workspace resolves to
#   serde = { version = "1.0.214", default-features = false, features = ["alloc", "derive"] }
# This repo's workspace entry is `serde = { version = "1.0.214" }` — default features ON — because
# the relay chain and every other system parachain rely on that. Cargo ignores a member-level
# `default-features = false` when the workspace entry has default features on, so `serde/std` would
# be enabled unconditionally and the wasm build of this pallet fails with ~1900
# `can't find crate for std` errors while the native build stays green. Inlining upstream's own
# resolved pin here reproduces upstream's build exactly without touching the workspace entry.
serde = { version = "1.0.214", default-features = false, features = ["alloc", "derive"] }
frame-benchmarking = { workspace = true, optional = true }
frame-support = { workspace = true }
frame-system = { workspace = true }
sp-core = { workspace = true }
sp-io = { workspace = true }
sp-runtime = { workspace = true }
xcm = { workspace = true }
xcm-executor = { workspace = true }
cumulus-primitives-core = { workspace = true }

indiv-pallet-people = { workspace = true }
indiv-support = { workspace = true }
verifiable = { workspace = true }

[dev-dependencies]
frame-executive = { workspace = true }
pallet-balances = { workspace = true }
parking_lot = { workspace = true }
verifiable = { workspace = true, features = ["mock"] }

[features]
default = ["std"]
std = [
	"codec/std",
	"cumulus-primitives-core/std",
	"frame-benchmarking?/std",
	"frame-executive/std",
	"frame-support/std",
	"frame-system/std",
	"indiv-pallet-people/std",
	"indiv-support/std",
	"log/std",
	"pallet-balances/std",
	"scale-info/std",
	"serde/std",
	"sp-core/std",
	"sp-io/std",
	"sp-runtime/std",
	"verifiable/std",
	"xcm-executor/std",
	"xcm/std",
]
runtime-benchmarks = [
	"cumulus-primitives-core/runtime-benchmarks",
	"frame-benchmarking/runtime-benchmarks",
	"frame-support/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"indiv-pallet-people/runtime-benchmarks",
	"indiv-support/runtime-benchmarks",
	"pallet-balances/runtime-benchmarks",
	"sp-runtime/runtime-benchmarks",
	"xcm-executor/runtime-benchmarks",
	"xcm/runtime-benchmarks",
]
try-runtime = [
	"frame-executive/try-runtime",
	"frame-support/try-runtime",
	"frame-system/try-runtime",
	"indiv-pallet-people/try-runtime",
	"pallet-balances/try-runtime",
	"sp-runtime/try-runtime",
]
