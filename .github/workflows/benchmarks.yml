name: Benchmarks

# Regenerates runtime weights on the org's self-hosted benchmark runner (`gh-runner-03`,
# labels: self-hosted + ubuntu-latest + benchmarks) and pushes the weights back to the branch.
#
# Two ways in:
#
#   1. Comment `/bench ...` on a pull request. Only members of the `paseo-core` team can do
#      this. Note that GitHub always runs the `main` version of this file for `issue_comment`
#      events, so changes here only take effect once merged.
#
#        /bench                                              # every pallet of all four runtimes
#        /bench --runtime paseo                              # one runtime, all pallets
#        /bench --runtime people-paseo --pallet pallet_proxy # one runtime, one pallet
#        /bench --pallet pallet_balances --continue-on-fail
#        /bench --runtime people-paseo --exclude-pallets indiv_pallet_coinage   # all pallets but one
#        /bench --runtime people-paseo --jobs 4              # 4 pallets at a time, see `--jobs` below
#        /bench --help
#
#   2. Run this workflow manually (Actions -> Benchmarks -> Run workflow) against any branch.
#
# The set of runtimes, their genesis presets and their weight templates live in
# .github/workflows/runtimes-matrix.json; the benchmarking itself is .github/scripts/cmd/cmd.py.
# Both are always taken from the commit this workflow runs from (`main` for `/bench`), never from
# the branch being benchmarked: a PR branch that predates a tooling change would otherwise run its
# own stale copy, which is how a `--exclude-pallets` got silently ignored in run 35333308472.
#
# What makes a failure cheap:
#   - cmd.py first runs every pallet at `--steps 2 --repeat 1`, which takes minutes and catches the
#     benchmarks that cannot run at all. Those pallets are reported and skipped, instead of failing
#     only after running every other benchmark of the pallet in full.
#   - A full sweep (no `--pallet`) keeps going past a failed pallet.
#   - Every pallet that finishes becomes its own commit, and whatever was committed is pushed even
#     when the run fails, is cancelled or times out.
#
# `--jobs N` benchmarks N pallets at a time. frame-omni-bencher is single-threaded, so without it a
# run uses one core. Pallets running side by side compete for caches and memory bandwidth and come
# out somewhat heavier, so use it to iterate and a plain run for the weights that ship.
#
# A full sweep can run for days. The `bench` job only benchmarks and commits locally; everything
# that talks to GitHub afterwards (pushing the weights, commenting, reacting) lives in `publish`,
# because a job's GITHUB_TOKEN expires after 24 hours and `publish` gets a fresh one when it starts.

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      runtime:
        description: Runtime to benchmark
        type: choice
        default: all
        options:
          - all
          - paseo
          - asset-hub-paseo
          - people-paseo
          - bulletin-paseo
      pallet:
        description: 'Pallet(s), space separated. Empty means every pallet of the runtime.'
        type: string
        default: ''
      exclude_pallets:
        description: 'Pallet(s), space separated, to skip.'
        type: string
        default: ''
      steps:
        description: Number of steps across component ranges
        type: string
        default: '50'
      repeat:
        description: Number of times each benchmark repeats per step
        type: string
        default: '20'
      continue_on_fail:
        description: Keep going when a pallet fails even with explicit pallets (always on without them)
        type: boolean
        default: false
      jobs:
        description: Pallets benchmarked at the same time (more is faster but perturbs timings)
        type: string
        default: '1'

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read

# One benchmark run at a time - there is a single benchmark machine, and weights measured
# while it is busy with something else are not worth having.
concurrency:
  group: benchmarks
  cancel-in-progress: false

env:
  PASEO_CORE_TEAM: paseo-core

jobs:
  preflight:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.comment.body, '/bench')
    runs-on: ubuntu-22.04
    outputs:
      # Arguments passed to `cmd.py bench`, e.g. "--runtime paseo --pallet pallet_balances".
      args: ${{ steps.args.outputs.args }}
      # Where the benchmark job checks out from, and pushes the weights back to.
      repo: ${{ steps.args.outputs.repo }}
      ref: ${{ steps.args.outputs.ref }}
      pr-number: ${{ steps.args.outputs.pr_number }}
      is-help: ${{ steps.parse-comment.outputs.is_help }}
    steps:
      - name: Check team membership
        id: check-team
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.PASEO_BENCH_PAT }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          set -uo pipefail
          api="https://api.github.com/orgs/${{ github.repository_owner }}"

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::PASEO_BENCH_PAT is empty - the secret is not available to this repository."
            exit 1
          fi

          call() {
            curl -sS -w '\n%{http_code}' \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$1"
          }

          response=$(call "$api/teams/${PASEO_CORE_TEAM}/memberships/${COMMENTER}")
          status=$(printf '%s' "$response" | tail -n1)
          state=$(printf '%s' "$response" | sed '$d' | jq -r '.state // empty')
          echo "membership lookup for ${COMMENTER}: HTTP $status, state='${state:-none}'"

          case "$status" in
            200)
              if [ "$state" = "active" ]; then
                echo "is_allowed=true" >> $GITHUB_OUTPUT
              else
                echo "is_allowed=false" >> $GITHUB_OUTPUT
              fi
              ;;
            404)
              # 404 is ambiguous: either the commenter really is not in the team, or the token
              # cannot see a `closed` team at all. Probe the team itself to tell those apart -
              # otherwise a broken token silently looks like "you are not a member", which is
              # exactly how this went unnoticed in comment-trigger.yml.
              team_status=$(call "$api/teams/${PASEO_CORE_TEAM}" | tail -n1)
              if [ "$team_status" = "200" ]; then
                echo "${COMMENTER} is not a member of ${PASEO_CORE_TEAM}"
                echo "is_allowed=false" >> $GITHUB_OUTPUT
              else
                echo "::error::PASEO_BENCH_PAT cannot read the ${PASEO_CORE_TEAM} team (HTTP $team_status). It needs 'read:org' (classic PAT) or organization 'Members: read' (fine-grained PAT), and must not be expired."
                exit 1
              fi
              ;;
            *)
              echo "::error::Membership lookup failed with HTTP $status. Check that PASEO_BENCH_PAT is valid and not expired."
              exit 1
              ;;
          esac

      # Benchmarks run untrusted PR code on a persistent, self-hosted machine, so a non-member
      # comment must stop here and never reach the `bench` job.
      - name: Reject non-members
        if: github.event_name == 'issue_comment' && steps.check-team.outputs.is_allowed != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.reactions.createForIssueComment({
              comment_id: ${{ github.event.comment.id }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              content: 'confused'
            })
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Sorry, only members of \`${process.env.PASEO_CORE_TEAM}\` can run benchmarks.`
            })
            core.setFailed('Commenter is not a member of ${{ env.PASEO_CORE_TEAM }}')

      # When the gate itself breaks (bad or under-scoped PAT) the job aborts before the rejection
      # step, so say so on the PR instead of leaving `/bench` to look like it was ignored.
      - name: Report a broken authorization check
        if: ${{ failure() && github.event_name == 'issue_comment' && steps.check-team.outcome == 'failure' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.reactions.createForIssueComment({
              comment_id: ${{ github.event.comment.id }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              content: 'confused'
            })
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Could not verify \`${process.env.PASEO_CORE_TEAM}\` membership, so \`/bench\` did not run. This is a CI configuration problem, not a permissions decision about you — [see the logs](${runUrl}).`
            })

      - name: Acknowledge the comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.reactions.createForIssueComment({
              comment_id: ${{ github.event.comment.id }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              content: 'eyes'
            })

      - name: Parse the comment
        id: parse-comment
        if: github.event_name == 'issue_comment'
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          # Only the first line counts, so a command can be followed by prose.
          first_line=$(printf '%s' "$COMMENT_BODY" | head -n1 | tr -d '\r')

          if [[ ! "$first_line" =~ ^/bench([[:space:]]+[-a-zA-Z0-9_.:=[:space:]]*)?$ ]]; then
            echo "::error::Could not parse '$first_line'. Expected: /bench [--runtime ...] [--pallet ...] [--exclude-pallets ...] [--jobs N] [--continue-on-fail] [--help]"
            exit 1
          fi

          # Normalise whitespace via word splitting. Not `xargs`: with no command it runs `echo`,
          # which would eat a leading `--help`.
          read -r -a parts <<< "${BASH_REMATCH[1]:-}"
          bench_args="${parts[*]:-}"
          echo "args=$bench_args" >> $GITHUB_OUTPUT

          if [[ "$bench_args" == *"--help"* ]]; then
            echo "is_help=true" >> $GITHUB_OUTPUT
          else
            echo "is_help=false" >> $GITHUB_OUTPUT
          fi

      - name: Resolve the PR branch
        id: pr
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            if (!context.payload.issue.pull_request) {
              core.setFailed('/bench only works on pull requests');
              return;
            }
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('repo', pr.data.head.repo.full_name);
            core.setOutput('ref', pr.data.head.ref);

      - name: Collect the arguments
        id: args
        env:
          EVENT_NAME: ${{ github.event_name }}
          # Everything below is attacker-influenceable, so it goes through the environment
          # rather than being interpolated into the shell.
          COMMENT_ARGS: ${{ steps.parse-comment.outputs.args }}
          PR_REPO: ${{ steps.pr.outputs.repo }}
          PR_REF: ${{ steps.pr.outputs.ref }}
          PR_NUM: ${{ github.event.issue.number }}
          INPUT_RUNTIME: ${{ inputs.runtime }}
          INPUT_PALLET: ${{ inputs.pallet }}
          INPUT_EXCLUDE_PALLETS: ${{ inputs.exclude_pallets }}
          INPUT_STEPS: ${{ inputs.steps }}
          INPUT_REPEAT: ${{ inputs.repeat }}
          INPUT_CONTINUE_ON_FAIL: ${{ inputs.continue_on_fail }}
          INPUT_JOBS: ${{ inputs.jobs }}
        run: |
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            echo "args=$COMMENT_ARGS" >> $GITHUB_OUTPUT
            echo "repo=$PR_REPO" >> $GITHUB_OUTPUT
            echo "ref=$PR_REF" >> $GITHUB_OUTPUT
            echo "pr_number=$PR_NUM" >> $GITHUB_OUTPUT
          else
            # Plain `if`s, not `[ ... ] && ...`: the latter returns 1 when the test fails, which
            # under the default `bash -e` would abort the step.
            args="--steps $INPUT_STEPS --repeat $INPUT_REPEAT"
            if [ "$INPUT_RUNTIME" != "all" ]; then args="$args --runtime $INPUT_RUNTIME"; fi
            if [ -n "$INPUT_PALLET" ]; then args="$args --pallet $INPUT_PALLET"; fi
            if [ -n "$INPUT_EXCLUDE_PALLETS" ]; then args="$args --exclude-pallets $INPUT_EXCLUDE_PALLETS"; fi
            if [ "$INPUT_CONTINUE_ON_FAIL" = "true" ]; then args="$args --continue-on-fail"; fi
            if [ -n "$INPUT_JOBS" ] && [ "$INPUT_JOBS" != "1" ]; then args="$args --jobs $INPUT_JOBS"; fi
            echo "args=$args" >> $GITHUB_OUTPUT
            echo "repo=${{ github.repository }}" >> $GITHUB_OUTPUT
            echo "ref=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "pr_number=" >> $GITHUB_OUTPUT
          fi

      # Reject arguments cmd.py does not understand now, not after an hour of building on the
      # benchmark machine. Same commit as the tooling the `bench` job runs.
      - name: Checkout the tooling
        if: steps.parse-comment.outputs.is_help != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github

      - name: Validate the arguments
        id: validate
        if: steps.parse-comment.outputs.is_help != 'true'
        env:
          BENCH_ARGS: ${{ steps.args.outputs.args }}
        run: python3 .github/scripts/cmd/cmd.py bench $BENCH_ARGS --check-args

      - name: Report invalid arguments
        if: ${{ failure() && github.event_name == 'issue_comment' && steps.validate.outcome == 'failure' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.reactions.createForIssueComment({
              comment_id: ${{ github.event.comment.id }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              content: 'confused'
            })
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `\`/bench\` did not run: its arguments were rejected. Try \`/bench --help\`. [See the logs](${runUrl}).`
            })

      - name: Summary
        run: |
          echo "args:   ${{ steps.args.outputs.args }}"
          echo "repo:   ${{ steps.args.outputs.repo }}"
          echo "ref:    ${{ steps.args.outputs.ref }}"
          echo "help:   ${{ steps.parse-comment.outputs.is_help }}"

  # `/bench --help` is cheap and does not need the benchmark machine.
  help:
    needs: [preflight]
    if: needs.preflight.outputs.is-help == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Render help
        id: help
        run: |
          {
            echo 'help<<CMDHELP'
            python3 .github/scripts/cmd/cmd.py bench --help
            echo 'CMDHELP'
          } >> $GITHUB_OUTPUT

      - name: Comment PR (Help)
        uses: actions/github-script@v7
        env:
          HELP: ${{ steps.help.outputs.help }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `<details><summary>Benchmark command help:</summary>\n\n\`\`\`\n${process.env.HELP}\n\`\`\`\n\n</details>`
            })

  bench:
    needs: [preflight]
    if: needs.preflight.outputs.is-help != 'true'
    # All three labels the benchmark runner carries, matching the convention its operator uses for
    # the other jobs on that machine. `ubuntu-latest` is a custom label on the runner, not the
    # GitHub-hosted image - `self-hosted` in the same list is what keeps routing unambiguous.
    runs-on: [self-hosted, ubuntu-latest, benchmarks]
    # A full sweep across all runtimes and pallets can take days (people-paseo alone ran past 24h
    # in run 35198320986). 7200 minutes is the 5-day ceiling GitHub enforces on self-hosted jobs
    # anyway; anything longer has to be split into several `/bench` runs, e.g. via
    # `--exclude-pallets` / `--pallet`.
    timeout-minutes: 7200
    # Nothing in this job may call the GitHub API or push after the benchmarks: its GITHUB_TOKEN
    # is dead by then on a long run. That is the `publish` job's work. The write scopes here are
    # only for the "started" comment, posted while the token is still fresh.
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
    outputs:
      job-url: ${{ steps.links.outputs.job_url }}
    env:
      JOB_NAME: bench
      # The tooling, checked out from the commit this workflow runs from - see the top of the file.
      TOOLS: .bench-tools
      BENCH_ARGS: ${{ needs.preflight.outputs.args }}
      TARGET_REPO: ${{ needs.preflight.outputs.repo }}
      TARGET_REF: ${{ needs.preflight.outputs.ref }}
      PR_NUMBER: ${{ needs.preflight.outputs.pr-number }}
      # pallet-revive-fixtures compiles Solidity fixtures by shelling out to solc and resolc, and
      # every runtime reaches that crate through system-parachains-constants. No runtime here
      # benchmarks pallet_revive today, so the fixtures are only needed to make the build link -
      # skipping them keeps solc and resolc off the runner entirely.
      #
      # This has to be revisited for TODO(#840) in asset-hub, which wants locally generated
      # pallet_revive weights: benchmarking that pallet needs real fixtures. PR #431 has the
      # working install step and the validated pins (solc 0.8.30, resolc 1.0.0) to restore.
      SKIP_PALLET_REVIVE_FIXTURES: 1
    steps:
      - name: Build workflow links
        id: links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jobs=$(curl -sS \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs")
          job_url=$(echo "$jobs" | jq -r --arg name "$JOB_NAME" '.jobs[] | select(.name | contains($name)) | .html_url' | head -n1)
          run_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "job_url=${job_url:-$run_url}" >> $GITHUB_OUTPUT
          echo "run_url=$run_url" >> $GITHUB_OUTPUT

      - name: Comment PR (Start)
        if: env.PR_NUMBER != '' && !contains(github.event.comment.body, '--quiet')
        uses: actions/github-script@v7
        env:
          JOB_URL: ${{ steps.links.outputs.job_url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: Number(process.env.PR_NUMBER),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Benchmarks \`${process.env.BENCH_ARGS || '(all runtimes, all pallets)'}\` have started 🚀 [See logs here](${process.env.JOB_URL})`
            })

      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_REF }}
          # Read-only, and not persisted: the token would be expired by the time the post-bench
          # `git fetch` runs, and a stale credential breaks even an anonymous fetch of a public repo.
          persist-credentials: false
          fetch-depth: 0

      # Inside the workspace, because actions/checkout will not write outside it. Kept out of git,
      # and cleaned up by the next run's checkout like any other untracked file.
      - name: Checkout the tooling
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: ${{ env.TOOLS }}
          sparse-checkout: .github
          persist-credentials: false

      - name: Prepare the local repository
        run: |
          echo "$TOOLS/" >> .git/info/exclude
          # cmd.py commits each pallet as it finishes; the commits stay local to the runner.
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          echo "BASE_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Set rust version via common env file
        run: cat .github/env >> $GITHUB_ENV

      # RUST_STABLE_VERSION must name the same toolchain as rust-toolchain.toml (channel "1.91"),
      # because that file is what cargo actually honours. "1.91.0" here installed a second,
      # separately-named toolchain and put rust-src on it, leaving the one the build used without
      # it - pallet-revive-fixtures builds with build-std and dies on "unable to build with the
      # standard library".
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}
          targets: wasm32v1-none,wasm32-unknown-unknown
          components: rust-src

      # Belt and braces against that drift returning: add the component to whichever toolchain
      # rust-toolchain.toml actually selects. A no-op while the two agree.
      - name: Ensure the pinned toolchain has rust-src
        run: |
          rustup show active-toolchain
          rustup component add rust-src

      # The runner is registered from outside this repo and can come back bare, so the run installs
      # what it needs rather than assuming the host was prepared by hand. apt-get is a no-op once
      # the packages are there. libssl-dev and libclang-dev ship only headers, so they are easy to
      # leave out and only show up as a link error much later in the build.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake protobuf-compiler pkg-config \
            libssl-dev libclang-dev python3

      # Not apt packages: cmd.py drives frame-omni-bencher, and the closing PR comment uses
      # subweight. The bencher is pinned in .github/env and re-fetched each run so it always
      # matches the pin.
      - name: Install frame-omni-bencher
        run: |
          # -f matters: without it curl writes an HTTP error page to the output file, which then
          # gets chmod +x'd and "runs" as a shell script. `:?` catches the pin being unset at all,
          # which happens when a PR branch predates the variable being added to .github/env.
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors --max-time 600 \
            "https://github.com/paritytech/polkadot-sdk/releases/download/${FRAME_OMNI_BENCHER_RELEASE_VERSION:?not set in .github/env - rebase this branch onto main}/frame-omni-bencher" \
            -o frame-omni-bencher
          chmod +x frame-omni-bencher
          sudo mv frame-omni-bencher /usr/local/bin/frame-omni-bencher
          frame-omni-bencher --version

      - name: Install subweight
        run: command -v subweight || cargo install subweight --locked

      # No rust-cache here on purpose: the runner is persistent and keeps its `target/` between
      # runs, so uploading a multi-GB cache of a `production` build would only cost time.

      - name: Run benchmarks
        run: |
          echo "Running: cmd.py bench $BENCH_ARGS on ${TARGET_REPO}@${TARGET_REF}"
          mkdir -p bench-result
          python3 "$TOOLS/.github/scripts/cmd/cmd.py" bench $BENCH_ARGS --commit --summary bench-result/summary.json

      # Everything from here on stays local to the runner - see the note on `permissions` above.
      # `always()` from here on: a failed, cancelled or timed-out run still ships every pallet that
      # made it into a commit. `publish` pushes them as patches with a fresh token.
      - name: Export the commits
        id: commit
        if: always()
        run: |
          mkdir -p bench-result
          # Unset when the job died before the tooling was even in place.
          if [ -z "${BASE_SHA:-}" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          count=$(git rev-list --count "$BASE_SHA..HEAD")
          echo "$count pallet commit(s) since $BASE_SHA"
          if [ "$count" = "0" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git format-patch -o bench-result/patches "$BASE_SHA..HEAD"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Compare weights with subweight
        if: always() && steps.commit.outputs.changed == 'true'
        continue-on-error: true
        run: |
          # Compare against the base repo's main, not `origin/main` - for a PR from a fork,
          # `origin` is the fork. Anonymous on purpose: the repo is public and the token is stale.
          git fetch --no-tags https://github.com/${{ github.repository }}.git main
          subweight compare commits \
            --path-pattern "./**/weights/**/*.rs" \
            --method asymptotic \
            --format markdown \
            --no-color \
            --change added changed \
            --ignore-errors \
            FETCH_HEAD HEAD > bench-result/subweight.md

      # Also when nothing changed: the summary of failed pallets is in here too.
      - name: Upload the result for publishing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-result-${{ github.run_id }}
          path: bench-result/
          if-no-files-found: ignore

      # The weights as files, for runs whose commits are not pushed - e.g. a manual run on `main`.
      - name: Upload the weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weights-${{ github.run_id }}
          path: |
            relay/*/src/weights/**/*.rs
            system-parachains/*/src/weights/**/*.rs
          if-no-files-found: warn

  # Pushes the weights and reports back. A separate job because GITHUB_TOKEN expires after 24
  # hours, and a job gets its token when it starts - so this one always has a live token, however
  # long `bench` took. Hosted, so it does not queue behind the benchmark machine. `ubuntu-24.04`,
  # not `ubuntu-latest`: the benchmark runner carries a custom `ubuntu-latest` label.
  publish:
    needs: [preflight, bench]
    if: ${{ always() && needs.preflight.result == 'success' && needs.preflight.outputs.is-help != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Needs `contents: write` on top of the workflow-wide set, to push the regenerated weights.
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
    env:
      BENCH_ARGS: ${{ needs.preflight.outputs.args }}
      TARGET_REPO: ${{ needs.preflight.outputs.repo }}
      TARGET_REF: ${{ needs.preflight.outputs.ref }}
      PR_NUMBER: ${{ needs.preflight.outputs.pr-number }}
      BENCH_RESULT: ${{ needs.bench.result }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      JOB_URL: ${{ needs.bench.outputs.job-url }}
    steps:
      # Whatever `bench` managed to commit, whether or not it succeeded. Missing when the job died
      # before uploading anything, e.g. in the build.
      - name: Download the result
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: bench-result-${{ github.run_id }}
          path: ${{ runner.temp }}/bench-result

      - name: Inspect the result
        id: result
        run: |
          dir="$RUNNER_TEMP/bench-result"
          count=$(ls "$dir"/patches/*.patch 2>/dev/null | wc -l)
          echo "patches=$count" >> $GITHUB_OUTPUT
          failed=""
          if [ -f "$dir/summary.json" ]; then
            failed=$(jq -r '[.failed | to_entries[] | "\(.key): \(.value | join(", "))"] | join("; ")' "$dir/summary.json")
          fi
          echo "failed=$failed" >> $GITHUB_OUTPUT
          echo "patches: $count, failed: ${failed:-none}"

      - name: Checkout
        if: steps.result.outputs.patches != '0'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_REF }}
          # GITHUB_TOKEN for a branch in this repo, which is the common case and keeps the run
          # working even when the PAT is unhealthy. The PAT is only needed for a PR from a fork,
          # where GITHUB_TOKEN cannot push the weights back.
          token: ${{ needs.preflight.outputs.repo == github.repository && secrets.GITHUB_TOKEN || secrets.PASEO_BENCH_PAT }}
          fetch-depth: 0

      - name: Push the weights
        id: push
        if: steps.result.outputs.patches != '0'
        run: |
          # Weights land in a PR, never straight on the protected default branch.
          if [ "$TARGET_REF" = "${{ github.event.repository.default_branch }}" ]; then
            echo "::warning::Refusing to push weights to $TARGET_REF; download them from the run artifact and open a PR instead."
            echo "pushed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # One commit per pallet. The branch may have moved during a multi-day run; --3way lets the
          # weights land on top.
          git am --3way "$RUNNER_TEMP"/bench-result/patches/*.patch
          git push origin "HEAD:$TARGET_REF"
          echo "pushed=true" >> $GITHUB_OUTPUT

      - name: Comment PR (Success)
        if: ${{ success() && needs.bench.result == 'success' && env.PR_NUMBER != '' && !contains(github.event.comment.body, '--quiet') }}
        uses: actions/github-script@v7
        env:
          PUSHED: ${{ steps.push.outputs.pushed }}
          PATCHES: ${{ steps.result.outputs.patches }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const file = `${process.env.RUNNER_TEMP}/bench-result/subweight.md`;
            const subweight = fs.existsSync(file) ? fs.readFileSync(file, 'utf8').trim() : '';
            const details = subweight
              ? `\n\n<details>\n\n<summary>Subweight results:</summary>\n\n${subweight}\n\n</details>`
              : '';
            const pushed = process.env.PUSHED === 'true'
              ? `The updated weights have been pushed to this branch (${process.env.PATCHES} pallet commit(s)).`
              : process.env.PATCHES !== '0'
                ? 'The updated weights were not pushed - download them from the run artifacts.'
                : 'No weight changed.';

            github.rest.issues.createComment({
              issue_number: Number(process.env.PR_NUMBER),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Benchmarks \`${process.env.BENCH_ARGS || '(all runtimes, all pallets)'}\` have finished ✅ ${pushed} [See logs here](${process.env.RUN_URL})${details}`
            })

      # Also covers a cancelled or timed-out `bench` (which `failure()` alone would miss), and
      # a failure to push here.
      - name: Comment PR (Failure)
        if: ${{ (failure() || needs.bench.result != 'success') && env.PR_NUMBER != '' && !contains(github.event.comment.body, '--quiet') }}
        uses: actions/github-script@v7
        env:
          PUSHED: ${{ steps.push.outputs.pushed }}
          PATCHES: ${{ steps.result.outputs.patches }}
          FAILED: ${{ steps.result.outputs.failed }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const result = process.env.BENCH_RESULT;
            const what = result === 'cancelled'
              ? 'were cancelled or timed out ⏹️'
              : result === 'success' ? 'finished, but the weights could not be pushed ❌' : 'have failed ❌';
            const failed = process.env.FAILED ? ` Failed pallets: ${process.env.FAILED}.` : '';
            const saved = process.env.PUSHED === 'true'
              ? ` The ${process.env.PATCHES} pallet(s) that completed have been pushed to this branch, one commit each.`
              : ` Weights of the pallets that completed are in the \`weights-${context.runId}\` artifact.`;
            github.rest.issues.createComment({
              issue_number: Number(process.env.PR_NUMBER),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Benchmarks \`${process.env.BENCH_ARGS || '(all runtimes, all pallets)'}\` ${what}${failed}${saved} [See logs here](${process.env.JOB_URL || process.env.RUN_URL})`
            })

      - name: React on the comment
        if: ${{ always() && github.event_name == 'issue_comment' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const ok = process.env.BENCH_RESULT === 'success' && '${{ job.status }}' === 'success';
            github.rest.reactions.createForIssueComment({
              comment_id: ${{ github.event.comment.id }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              content: ok ? '+1' : 'confused'
            })
